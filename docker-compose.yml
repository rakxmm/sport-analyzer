# Local development only: Postgres, an S3 emulator standing in for Cloudflare R2, and the ffmpeg worker.
# The API and the frontend run on the host (see README). All logins below are throwaway dev defaults.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: football_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 API on :9000 (what the API, the worker and the browser talk to), web console on :9001.
  # MinIO no longer publishes its own images on Docker Hub or Quay; this is Chainguard's free build of
  # the same server (only the "latest" tags are public, the -dev one includes a shell).
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    # A directory in the data folder is a bucket, so creating it here saves a separate setup step.
    entrypoint: ["sh", "-c", "mkdir -p /data/football-app-dev && exec minio server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: src/FootballApp.Worker/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=football_app;Username=postgres;Password=postgres
      # Inside the compose network MinIO is "minio", not "localhost". The worker signs its own URLs
      # for ffmpeg, so it does not matter that the API on the host uses a different address.
      R2__ServiceUrl: http://minio:9000
      R2__AccessKeyId: minioadmin
      R2__SecretAccessKey: minioadmin
      R2__BucketName: football-app-dev
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
